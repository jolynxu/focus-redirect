<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Focus Redirect – Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #222; }
    h1 { font-size: 22px; }
    label { display: block; font-weight: 600; margin-top: 22px; }
    .hint { color: #666; font-size: 13px; margin: 4px 0 6px; }
    textarea { width: 100%; height: 150px; font: 14px ui-monospace, monospace; padding: 8px; box-sizing: border-box; }
    button { margin-top: 18px; padding: 8px 16px; font: inherit; background: #2e7d32; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    #saved { margin-left: 10px; color: #2e7d32; }
  </style>
</head>
<body>
  <h1>Focus Redirect – Settings</h1>

  <label for="blocked">Distracting sites</label>
  <div class="hint">One per line, e.g. <code>youtube.com</code>. Subdomains are included automatically (m.youtube.com, old.reddit.com…).</div>
  <textarea id="blocked"></textarea>

  <label for="work">Work pages</label>
  <div class="hint">One full URL per line. If any of these is already open, you're switched to that tab. Otherwise the distracting tab is sent to the <b>first</b> URL.</div>
  <textarea id="work"></textarea>

  <button id="save">Save</button><span id="saved"></span>

  <script src="options.js"></script>
</body>
</html>
