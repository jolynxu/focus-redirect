<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; color: #222; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #ccc; background: #f6f6f6; cursor: pointer; }
    button.primary { background: #2e7d32; color: #fff; border-color: #2e7d32; }
    .timers { display: flex; gap: 6px; }
    .muted { color: #777; font-size: 12px; }
    #status { font-weight: 600; }
    a { color: #2e7d32; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Focus Redirect</h1>
  <div class="row">
    <span>Focus mode: <span id="status">…</span></span>
    <button id="toggle" class="primary">Toggle</button>
  </div>
  <div class="muted" id="timeLeft"></div>

  <div class="row">
    <span>Timed session:</span>
    <div class="timers">
      <button data-min="25">25m</button>
      <button data-min="50">50m</button>
      <button data-min="90">90m</button>
    </div>
  </div>

  <div class="row">
    <button id="blockThis">Block this site</button>
    <button id="workThis">Set as work page</button>
  </div>

  <div class="row">
    <span class="muted">Redirects so far: <span id="count">0</span></span>
    <a href="#" id="settings">Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
